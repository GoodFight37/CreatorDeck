apply plugin: 'com.android.application'

// Les notifications demandent `google-services.json` (le fichier que Firebase
// génère pour l'application Android, voir docs/cloud-supabase.md § Notifications).
// Il n'est **pas** dans le dépôt : chacun branche son projet Firebase. Sans lui,
// appliquer le greffon Google ferait échouer la compilation — donc on ne
// l'applique que s'il est là, et l'APK continue de se construire (sans
// notifications) pour qui n'a rien branché.
if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace = "com.creatordeck.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.creatordeck.app"
        manifestPlaceholders["cdAppLabel"] = "CreatorDeck"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // D-144 : un numéro qui augmente à chaque compilation, sur toutes les
        // machines (minutes depuis 2025-02-13 environ) ; Android refuse une mise
        // à jour dont le numéro n'est pas plus grand. `-PcdVersionCode=…`
        // l'impose si besoin. Le nom porte le commit (`-PcdVersionName=abc1234`).
        versionCode((project.findProperty("cdVersionCode") ?: (System.currentTimeMillis().intdiv(60000L) - 29000000L)).toString().toInteger())
        versionName((project.findProperty("cdVersionName") ?: "dev").toString())
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Clé de debug partagée (D-139) : toute machine signe l'APK de test avec la
    // même clé, donc une nouvelle version s'installe par-dessus l'ancienne sans
    // désinstaller. Mots de passe standard de debug Android : ce n'est PAS une
    // clé de publication, elle ne doit jamais signer une version Play Store.
    signingConfigs {
        debug {
            storeFile file("creatordeck-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            if (project.findProperty("cdStoryPreview")?.toString() == "true") {
                applicationIdSuffix ".histoire"
                manifestPlaceholders["cdAppLabel"] = "CreatorDeck Histoire"
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
