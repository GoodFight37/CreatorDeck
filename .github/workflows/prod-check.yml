name: Vérification de production

# Ce workflow ne construit rien et ne touche à rien : il **demande** au projet
# Supabase de production quelles migrations y sont installées, et il l'écrit
# dans le journal du run (`::notice`).
#
# Pourquoi il existe : depuis le poste où le jeu est développé, seuls
# api.github.com et les runners répondent — interroger la production demande
# donc de passer par ici. C'est le seul endroit qui sait répondre à « est-ce que
# la migration est collée ? », question qui revient à chaque livraison depuis
# qu'elles se collent depuis un téléphone.
#
# Il ne s'exécute que quand ce fichier change : une poussée de code ne le
# réveille pas.
on:
  push:
    paths:
      - ".github/workflows/prod-check.yml"
  workflow_dispatch:

jobs:
  etat:
    runs-on: ubuntu-24.04
    steps:
      - name: Ce que la production connaît
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "${URL:-}" ] || [ -z "${ANON:-}" ]; then
            echo "::error title=Configuration::URL ou clé anon absente des variables du dépôt"
            exit 0
          fi
          # La variable peut porter « /rest/v1/ » au bout : on la réduit à l'origine.
          BASE=$(printf '%s' "$URL" | sed -E 's#/rest/v1/?$##; s#/+$##')
          echo "::notice title=Origine::${BASE}"

          # Un appel de lecture seul, sans session : la fonction répond « connecte-toi »
          # si elle existe, « Could not find the function » si la migration manque.
          sonde() {
            local nom="$1" corps="$2" note="$3"
            local brut code message
            brut=$(curl -sS -m 20 -w '\n%{http_code}' -X POST "$BASE/rest/v1/rpc/$nom" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
              -H "Content-Type: application/json" --data "$corps" 2>&1 || true)
            code=$(printf '%s' "$brut" | tail -n1)
            message=$(printf '%s' "$brut" | sed '$d' | tr -d '\n' | cut -c1-160)
            echo "::notice title=$nom ($note)::HTTP $code · $message"
          }

          # Contrôles : des fonctions installées depuis longtemps. Si elles ne répondent
          # pas comme prévu, c'est la sonde qui est cassée, pas la production.
          sonde "pack_status" "{}" "0004, contrôle"
          sonde "wallet_get" "{}" "0027, contrôle"
          sonde "last_pack_shelf" "{}" "0012, contrôle"

          # Les migrations à vérifier, de la plus récente à la plus ancienne.
          sonde "tokens_get" "{}" "0035 ?"
          sonde "_streak_reward_tokens" '{"p_day":4}' "0035 ?"
          sonde "_tokens_per_pack" '{"p_at":"2026-07-10T18:30:00Z"}' "0035 ?"
          sonde "token_prices" "{}" "0035 ?"
          sonde "_pack_initial_packs" "{}" "0033 ?"

          # Le rapport de la base elle-même (`0035`) : chaque clé est un numéro
          # de migration, la valeur dit si elle est dans la base. C'est la
          # réponse complète, y compris pour `0034` — qui ne crée aucun objet et
          # qu'aucune sonde de fonction ne peut voir.
          sonde "schema_versions" "{}" "rapport complet (0035) ?"

      - name: Ce qui est collé, en clair
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "${URL:-}" ] || [ -z "${ANON:-}" ]; then
            echo "::error title=Configuration::URL ou clé anon absente des variables du dépôt"
            exit 0
          fi
          BASE=$(printf '%s' "$URL" | sed -E 's#/rest/v1/?$##; s#/+$##')

          # Le JSON brut de l'étape précédente est tronqué à 160 caractères : ici
          # on le range en une ligne par migration, dans l'ordre. C'est ce que le
          # joueur lit depuis son téléphone pour savoir quoi coller ensuite.
          RAW=$(curl -sS -m 20 -w '\n%{http_code}' -X POST "$BASE/rest/v1/rpc/schema_versions" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" --data '{}' 2>&1 || true)
          CODE=$(printf '%s' "$RAW" | tail -n1)
          BODY=$(printf '%s' "$RAW" | sed '$d')

          if [ "$CODE" != "200" ]; then
            echo "::warning title=Le rapport de la base ne répond pas::HTTP $CODE — 0035 n'est pas collée. Les contrôles au-dessus disent ce qui, lui, répond."
            exit 0
          fi

          ABSENTES=""
          for M in 0030 0031 0032 0033 0034 0035; do
            ETAT=$(printf '%s' "$BODY" | jq -r --arg k "$M" '.[$k] // false')
            if [ "$ETAT" = "true" ]; then
              echo "::notice title=$M::collée"
            else
              echo "::notice title=$M::ABSENTE"
              ABSENTES="$ABSENTES $M"
            fi
          done

          if [ -n "$ABSENTES" ]; then
            echo "::warning title=Il reste à coller::$ABSENTES"
          else
            echo "::notice title=La base est à jour::0030 à 0035, toutes collées"
          fi
