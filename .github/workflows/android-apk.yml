name: APK Android (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nécessaire pour publier l'APK en pré-release (lien de téléchargement public).
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Le SDK Android est préinstallé sur les machines GitHub (ANDROID_HOME défini) ;
      # le plugin Android Gradle télécharge lui-même les composants manquants.
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      # Valide les données du jeu (taille du catalogue, rangs, saisons, taux).
      - run: npm run catalog:check
      # Contrôle renforcé : dans un APK, un portrait manquant laisse un trou et
      # un portrait orphelin pèse sans être affiché. Échec plutôt qu'avertissement.
      - run: npm run catalog:ci
      - run: npm run android:debug

      # 1. Artefact du run : pratique pour un test ponctuel, mais son
      #    téléchargement exige d'être connecté à GitHub.
      - uses: actions/upload-artifact@v4
        with:
          name: creatordeck-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 2. Pré-release « roulante » : un lien de téléchargement public et
      #    stable, sans connexion, écrasé à chaque build.
      #    https://github.com/GoodFight37/test/releases/download/debug-apk/creatordeck-debug.apk
      - name: Publier l'APK en pré-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk creatordeck-debug.apk
          NOTES="APK de test (signature debug, non publiable sur le Play Store).
          Reconstruit automatiquement à chaque build depuis \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)."
          if ! gh release view debug-apk >/dev/null 2>&1; then
            gh release create debug-apk \
              --prerelease \
              --title "CreatorDeck — APK de test (roulant)" \
              --notes "$NOTES"
          fi
          gh release edit debug-apk --notes "$NOTES"
          gh release upload debug-apk creatordeck-debug.apk --clobber
