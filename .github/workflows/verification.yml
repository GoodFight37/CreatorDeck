# Vérification de la branche : tout ce qui peut être joué sans secret.
#
# Ce dépôt est public : aucun secret n'est nécessaire, et aucun n'est utilisé.
# Le job du chemin cloud fabrique un `.env.local` avec une clé factice et
# **simule les RPC avec Playwright** — il ne parle donc jamais à la production.
#
# Les workflows avaient été supprimés le 8 octobre 2026 (commit `8760723`) :
# rien ne rejouait plus les suites automatiquement. Celui-ci les remet, et il
# est déclenché sur **toutes** les branches, pour qu'une branche d'audit
# venue d'ailleurs soit vérifiée comme les nôtres.

name: Vérification

on:
  push:
    branches: ["**"]
    # Les documents seuls poussés ne modifient pas le comportement vérifié.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un push suivi de l'ouverture d'une PR vérifie le même SHA une seule fois.
  group: creatordeck-verification-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unitaires, écrans, statique et build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer la révision à vérifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances verrouillées
        id: dependencies
        run: npm ci
      - name: Politique des migrations de production (sans secret)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node scripts/supabase-deploy.mjs --check
          node scripts/supabase-deploy.test.mjs
      - name: Tests unitaires
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test
      - name: Contrats de l'orchestration autonome
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:autonomy
      - name: Scénarios et captures d'écrans
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run ecrans
      - name: Vérification TypeScript
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck
      - name: ESLint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint
      - name: Vocabulaire de l'interface
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/check-jargon.mjs
      - name: Cohérence du catalogue et des saisons
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run catalog:ci
      - name: Build de production
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  supabase:
    name: Migrations SQL sur Postgres jetable
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer la révision à vérifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Installer les dépendances de vérification SQL hors du dépôt
        run: npm install --no-save embedded-postgres pg
      - name: Vérification complète des migrations
        run: npm run supabase:verify
        env:
          CI: "true"

  navigateur:
    name: Tests de bout en bout Playwright (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Récupérer la révision à vérifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (bureau et téléphone)
        run: npm run e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Pilote portraits (protection, normalisation et galerie)
        run: node --test tools/portrait-pilot/pilot.test.mjs
      - name: Joindre les captures de l'ouverture sur bureau et téléphone
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: creatordeck-booster-visual-${{ matrix.shard }}
          path: test-results/booster-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Joindre les observations mobiles (captures et mesures)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: creatordeck-mobile-observation-${{ matrix.shard }}
          path: |
            test-results/mobile-observation-*/**/*
            test-results/results.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Joindre les rapports du navigateur en cas d'échec
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: creatordeck-playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  navigateur-cloud:
    name: Test du chemin cloud avec RPC simulés
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer la révision à vérifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium
      - name: Créer une configuration Supabase factice
        # Les RPC sont interceptés par Playwright : cette clé ne sort jamais
        # du job, et rien n'est envoyé à la vraie base.
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://verification-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-key-ne-verifie-jamais-rien-000000000000000000000000
          EOF
      - name: Tester le tirage cloud (tous les RPC sont simulés)
        run: npm run e2e -- --grep "avec le serveur"
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Joindre les rapports du navigateur en cas d'échec
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: creatordeck-playwright-cloud-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  diagnostic:
    name: Résumer un échec (sans IA)
    if: >-
      always() &&
      (needs.quality.result == 'failure' || needs.supabase.result == 'failure' ||
      needs.navigateur.result == 'failure' || needs.navigateur-cloud.result == 'failure')
    needs: [quality, supabase, navigateur, navigateur-cloud]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Récupérer la révision vérifiée
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Récupérer les rapports Playwright des jobs en échec
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: creatordeck-playwright-report-*
          path: incident/playwright
          merge-multiple: true
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Produire le diagnostic structuré sans IA
        env:
          CREATORDECK_JOBS: '{"quality":"${{ needs.quality.result }}","supabase":"${{ needs.supabase.result }}","navigateur":"${{ needs.navigateur.result }}","navigateur-cloud":"${{ needs.navigateur-cloud.result }}"}'
        run: node scripts/ci-incident-report.mjs incident/playwright incident/incident.json
      - name: Conserver le paquet d'incident et ses preuves Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatordeck-incident-${{ github.run_id }}-${{ github.run_attempt }}
          path: incident/
          if-no-files-found: warn
          retention-days: 14
